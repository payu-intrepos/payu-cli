# Build standalone binaries and publish to GitHub Releases.
#
# Trigger: push a version tag like v0.1.0
#   git tag v0.1.0 && git push origin v0.1.0
#
# Builds on macOS (arm64 + x86_64), Linux (x86_64 + arm64), and Windows (x86_64).

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-14
            label: mac-os_arm64
            ext: tar.gz
          - os: macos-latest
            label: mac-os_x86_64
            ext: tar.gz
          - os: ubuntu-latest
            label: linux_x86_64
            ext: tar.gz
          - os: ubuntu-24.04-arm
            label: linux_arm64
            ext: tar.gz
          - os: windows-latest
            label: windows_x86_64
            ext: zip

    runs-on: ${{ matrix.os }}
    name: Build (${{ matrix.label }})

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install . pyinstaller

      - name: Build binary
        run: pyinstaller payu.spec --clean --noconfirm

      - name: Package (tar.gz)
        if: matrix.ext == 'tar.gz'
        run: |
          cd dist
          tar -czf payu_${{ matrix.label }}.tar.gz payu
          ls -lh payu_${{ matrix.label }}.tar.gz

      - name: Package (zip for Windows)
        if: matrix.ext == 'zip'
        shell: pwsh
        run: |
          Compress-Archive -Path dist\payu.exe -DestinationPath dist\payu_${{ matrix.label }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: payu_${{ matrix.label }}
          path: dist/payu_${{ matrix.label }}.${{ matrix.ext }}

  release:
    needs: build
    runs-on: ubuntu-latest
    name: Publish Release

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          merge-multiple: true

      - name: List artifacts
        run: ls -lhR artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/payu_*.tar.gz
            artifacts/payu_*.zip
